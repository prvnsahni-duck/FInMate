name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master # Explicitly scope PRs targeting master

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0


      # This enables task distribution via Nx Cloud
      # Run this command as early as possible, before dependencies are installed
      # Learn more at https://nx.dev/ci/reference/nx-cloud-cli#npx-nxcloud-startcirun
      # Connect your workspace by running "nx connect" and uncomment this line to enable task distribution
      # - run: npx nx start-ci-run --distribute-on="3 linux-medium-js" --stop-agents-after="build"


      # Cache node_modules
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # 1. Added Prettier Format Check
      - name: Verify Code Formatting
        run: npx prettier --check .

      # 2. Run Nx tasks (Lint, Test, Build)
      # Removed "fix-ci" logic from here to prevent fake passes
      - name: Run Quality Gate (Lint, Test, Build)

      # Prepend any command with "nx record --" to record its logs to Nx Cloud
      # - run: npx nx record -- echo Hello World
        run: npx nx run-many -t lint test build
      # Nx Cloud recommends fixes for failures to help you get CI green faster. Learn more: https://nx.dev/ci/features/self-healing-ci


      # 3. Added explicit Type Safety check if not covered by your builds
      - name: Verify TypeScript Type Safety
        run: npx nx run-many -t typecheck --skip-nx-cache
        continue-on-error: true # Remove this line if all apps have a "typecheck" target defined

      # 4. Moved fix-ci to only run if the workflow actually fails
      - name: Nx Post-Failure Help
        run: npx nx fix-ci
        if: failure()
