<div class="mb-8">
  <h1 class="text-3xl md:text-4xl font-extrabold tracking-tight">
    Welcome back, <span class="bg-gradient-neon text-transparent bg-clip-text">{{ userName }}</span>
  </h1>
  <p class="text-slate-500 dark:text-slate-400 mt-2">Here is an overview of your finances.</p>
</div>

<!-- Summary Cards -->
<div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
  <div class="bg-white/70 dark:bg-finmate-card/70 backdrop-blur-xl border border-slate-200 dark:border-white/5 rounded-3xl p-6 shadow-xl shadow-black/5 hover:scale-[1.02] transition-transform">
    <h3 class="text-slate-500 dark:text-slate-400 text-sm font-medium mb-1">Total Balance</h3>
    <p class="text-3xl font-bold">$0.00</p>
  </div>
  <div class="bg-white/70 dark:bg-finmate-card/70 backdrop-blur-xl border border-slate-200 dark:border-white/5 rounded-3xl p-6 shadow-xl shadow-black/5 hover:scale-[1.02] transition-transform">
    <h3 class="text-slate-500 dark:text-slate-400 text-sm font-medium mb-1">Monthly Expenses</h3>
    <p class="text-3xl font-bold text-red-500 dark:text-red-400">$0.00</p>
  </div>
  <div class="bg-gradient-dark rounded-3xl p-6 shadow-xl shadow-black/10 hover:scale-[1.02] transition-transform text-white border border-white/10 relative overflow-hidden">
    <div class="absolute top-0 right-0 w-32 h-32 bg-finmate-neon/20 rounded-full blur-[40px]"></div>
    <h3 class="text-white/70 text-sm font-medium mb-1 relative z-10">Active Groups</h3>
    <p class="text-3xl font-bold relative z-10">0</p>
  </div>
</div>

<!-- Recent Activity -->
<div class="bg-white/70 dark:bg-finmate-card/70 backdrop-blur-xl border border-slate-200 dark:border-white/5 rounded-3xl p-6 shadow-xl shadow-black/5">
  <h2 class="text-xl font-bold mb-4">Recent Activity</h2>
  
  <div class="flex flex-col items-center justify-center py-12 text-center">
    <div class="w-16 h-16 bg-slate-100 dark:bg-white/5 rounded-full flex items-center justify-center mb-4">
      <svg class="w-8 h-8 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
    </div>
    <p class="text-slate-500 dark:text-slate-400 font-medium">No recent activity found.</p>
    <p class="text-sm text-slate-400 dark:text-slate-500 mt-1">Join a group or create an expense to get started.</p>
  </div>
</div>
