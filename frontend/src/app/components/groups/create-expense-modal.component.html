<div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-md transition-all duration-300">
  <div class="bg-white dark:bg-finmate-card rounded-3xl w-full max-w-lg p-8 shadow-2xl shadow-black/40 border border-slate-200 dark:border-white/5 relative transform scale-100 transition-all">
    <!-- Close Button -->
    <button (click)="closeModal()" class="absolute top-6 right-6 text-slate-400 hover:text-slate-600 dark:hover:text-white transition-colors">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
      </svg>
    </button>
    
    <h2 class="text-2xl font-bold mb-2">Add New Expense</h2>
    <p class="text-sm text-slate-500 dark:text-slate-400 mb-6">Create a shared expense for the group.</p>
    
    <!-- Error Alert -->
    <div *ngIf="errorMessage" class="mb-6 p-4 bg-red-500/10 border border-red-500/25 text-red-500 rounded-2xl text-sm font-semibold flex items-center space-x-2 animate-shake">
      <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
      <span>{{ errorMessage }}</span>
    </div>
    
    <form [formGroup]="expenseForm" (ngSubmit)="onSubmit()" class="space-y-4">
      <div>
        <label class="block text-sm font-semibold mb-2 text-slate-700 dark:text-slate-300">Description / Title *</label>
        <input 
          type="text" 
          formControlName="title" 
          placeholder="e.g., Dinner, Groceries" 
          class="w-full px-4 py-3 rounded-2xl bg-slate-50 dark:bg-black/20 border border-slate-200 dark:border-white/10 text-slate-900 dark:text-white placeholder-slate-400 focus:border-finmate-neon focus:ring-1 focus:ring-finmate-neon outline-none transition-all"
          [class.border-red-500]="expenseForm.get('title')?.touched && expenseForm.get('title')?.errors"
        >
        <span *ngIf="expenseForm.get('title')?.touched && expenseForm.get('title')?.hasError('required')" class="text-xs text-red-500 mt-1 block">
          Title is required.
        </span>
        <span *ngIf="expenseForm.get('title')?.touched && expenseForm.get('title')?.hasError('maxlength')" class="text-xs text-red-500 mt-1 block">
          Title cannot exceed 160 characters.
        </span>
      </div>
      
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-semibold mb-2 text-slate-700 dark:text-slate-300">Amount *</label>
          <input 
            type="number" 
            step="0.01"
            formControlName="amountTotal" 
            placeholder="0.00" 
            class="w-full px-4 py-3 rounded-2xl bg-slate-50 dark:bg-black/20 border border-slate-200 dark:border-white/10 text-slate-900 dark:text-white placeholder-slate-400 focus:border-finmate-neon focus:ring-1 focus:ring-finmate-neon outline-none transition-all"
            [class.border-red-500]="expenseForm.get('amountTotal')?.touched && expenseForm.get('amountTotal')?.errors"
          >
          <span *ngIf="expenseForm.get('amountTotal')?.touched && expenseForm.get('amountTotal')?.hasError('required')" class="text-xs text-red-500 mt-1 block">
            Amount is required.
          </span>
          <span *ngIf="expenseForm.get('amountTotal')?.touched && expenseForm.get('amountTotal')?.hasError('min')" class="text-xs text-red-500 mt-1 block">
            Amount must be greater than zero.
          </span>
        </div>
        <div>
          <label class="block text-sm font-semibold mb-2 text-slate-700 dark:text-slate-300">Currency *</label>
          <select 
            formControlName="currency" 
            class="w-full px-4 py-3 rounded-2xl bg-slate-50 dark:bg-black/20 border border-slate-200 dark:border-white/10 text-slate-900 dark:text-white focus:border-finmate-neon focus:ring-1 focus:ring-finmate-neon outline-none transition-all cursor-pointer"
          >
            <option value="USD">USD ($)</option>
            <option value="INR">INR (₹)</option>
            <option value="EUR">EUR (€)</option>
          </select>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-semibold mb-2 text-slate-700 dark:text-slate-300">Category *</label>
          <select 
            formControlName="category" 
            class="w-full px-4 py-3 rounded-2xl bg-slate-50 dark:bg-black/20 border border-slate-200 dark:border-white/10 text-slate-900 dark:text-white focus:border-finmate-neon focus:ring-1 focus:ring-finmate-neon outline-none transition-all cursor-pointer"
          >
            <option value="Food & Drinks">Food & Drinks</option>
            <option value="Travel">Travel</option>
            <option value="Utilities">Utilities</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Others">Others</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-semibold mb-2 text-slate-700 dark:text-slate-300">Date *</label>
          <input 
            type="date" 
            formControlName="expenseDate" 
            class="w-full px-4 py-3 rounded-2xl bg-slate-50 dark:bg-black/20 border border-slate-200 dark:border-white/10 text-slate-900 dark:text-white focus:border-finmate-neon focus:ring-1 focus:ring-finmate-neon outline-none transition-all"
            [class.border-red-500]="expenseForm.get('expenseDate')?.touched && expenseForm.get('expenseDate')?.errors"
          >
        </div>
      </div>

      <div>
        <label class="block text-sm font-semibold mb-2 text-slate-700 dark:text-slate-300">Paid By *</label>
        <select 
          formControlName="paidByUserId" 
          class="w-full px-4 py-3 rounded-2xl bg-slate-50 dark:bg-black/20 border border-slate-200 dark:border-white/10 text-slate-900 dark:text-white focus:border-finmate-neon focus:ring-1 focus:ring-finmate-neon outline-none transition-all cursor-pointer"
        >
          <option *ngFor="let member of members" [value]="member.user.id">
            {{ member.user.displayName || member.user.email }}
          </option>
        </select>
      </div>

      <div>
        <label class="block text-sm font-semibold mb-2 text-slate-700 dark:text-slate-300">Split Equally Among</label>
        <div class="space-y-2 max-h-40 overflow-y-auto p-3 bg-slate-50 dark:bg-black/10 rounded-2xl border border-slate-200/50 dark:border-white/5">
          <label *ngFor="let member of members" class="flex items-center space-x-3 cursor-pointer p-2 rounded-xl hover:bg-slate-100 dark:hover:bg-white/5 transition-colors">
            <input 
              type="checkbox" 
              [checked]="selectedUserIds.has(member.user.id)" 
              (change)="toggleParticipant(member.user.id)" 
              class="w-5 h-5 rounded-lg border-slate-300 text-finmate-neon focus:ring-finmate-neon cursor-pointer"
            >
            <span class="text-sm font-medium text-slate-800 dark:text-slate-200">
              {{ member.user.displayName || member.user.email }}
            </span>
          </label>
        </div>
        <span *ngIf="selectedUserIds.size === 0" class="text-xs text-red-500 mt-1 block">
          At least one participant must be selected.
        </span>
      </div>
      
      <div class="flex space-x-4 pt-4">
        <button 
          type="button" 
          (click)="closeModal()" 
          class="flex-1 py-3 px-4 bg-slate-100 dark:bg-white/5 text-slate-700 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-white/10 rounded-2xl font-semibold transition-all"
        >
          Cancel
        </button>
        <button 
          type="submit" 
          [disabled]="expenseForm.invalid || selectedUserIds.size === 0 || isSubmitting"
          class="flex-1 py-3 px-4 bg-gradient-neon disabled:opacity-50 disabled:cursor-not-allowed text-white rounded-2xl font-semibold shadow-lg shadow-finmate-neon/30 hover:shadow-finmate-neon/50 transition-all flex items-center justify-center space-x-2"
        >
          <span *ngIf="isSubmitting" class="w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
          <span>{{ isSubmitting ? 'Saving...' : 'Save Expense' }}</span>
        </button>
      </div>
    </form>
  </div>
</div>
