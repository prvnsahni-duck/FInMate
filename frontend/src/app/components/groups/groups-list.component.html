<div class="flex items-center justify-between mb-8">
  <div>
    <h1 class="text-3xl md:text-4xl font-extrabold tracking-tight">Your Groups</h1>
    <p class="text-slate-500 dark:text-slate-400 mt-2">Manage your shared expenses and settlements.</p>
  </div>
  <button class="py-2 px-4 bg-gradient-neon text-white rounded-xl font-semibold shadow-lg shadow-finmate-neon/30 hover:shadow-finmate-neon/50 transition-all flex items-center space-x-2">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
    <span class="hidden sm:inline">New Group</span>
  </button>
</div>

<div *ngIf="isLoading" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
  <div *ngFor="let i of [1,2,3]" class="h-48 bg-slate-200 dark:bg-white/5 animate-pulse rounded-3xl"></div>
</div>

<div *ngIf="!isLoading && groups.length === 0" class="bg-white/70 dark:bg-finmate-card/70 backdrop-blur-xl border border-slate-200 dark:border-white/5 rounded-3xl p-12 text-center shadow-xl shadow-black/5">
  <div class="w-20 h-20 bg-slate-100 dark:bg-white/5 rounded-full flex items-center justify-center mx-auto mb-4">
    <svg class="w-10 h-10 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
  </div>
  <h3 class="text-xl font-bold mb-2">No Groups Yet</h3>
  <p class="text-slate-500 dark:text-slate-400 mb-6">Create a group to start splitting bills with friends or family.</p>
</div>

<div *ngIf="!isLoading && groups.length > 0" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
  <a *ngFor="let group of groups" [routerLink]="['/groups', group.id]" class="block group bg-white/70 dark:bg-finmate-card/70 backdrop-blur-xl border border-slate-200 dark:border-white/5 rounded-3xl p-6 shadow-xl shadow-black/5 hover:border-finmate-neon/50 hover:shadow-finmate-neon/10 transition-all cursor-pointer">
    <div class="flex items-start justify-between mb-4">
      <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-finmate-neon to-finmate-neon2 flex items-center justify-center text-white font-bold text-xl shadow-inner">
        {{ group.name.substring(0, 2).toUpperCase() }}
      </div>
      <span class="px-3 py-1 bg-slate-100 dark:bg-white/10 rounded-full text-xs font-semibold text-slate-600 dark:text-slate-300">
        {{ group.currency }}
      </span>
    </div>
    
    <h3 class="text-lg font-bold mb-1 group-hover:text-finmate-neon transition-colors">{{ group.name }}</h3>
    <p class="text-sm text-slate-500 dark:text-slate-400 line-clamp-2">{{ group.description || 'No description provided.' }}</p>
  </a>
</div>
