<div class="text-center mb-8">
  <h2 class="text-2xl font-bold">Forgot your password?</h2>
  <p class="text-slate-500 dark:text-slate-400 mt-2">
    Enter your email and we'll send you a reset link.
  </p>
</div>

@if (submitted()) {
  <div
    class="p-4 bg-finmate-neon/10 text-slate-700 dark:text-slate-200 border border-finmate-neon/40 rounded-xl text-sm text-center"
    role="status"
  >
    If an account exists for that address, a password reset link is on its way.
    Check your inbox and spam folder.
  </div>

  <div class="mt-6 text-center text-sm">
    <a
      routerLink="/auth/login"
      class="text-finmate-neon2 font-semibold hover:underline"
      >Back to sign in</a
    >
  </div>
} @else {
  <form
    data-testid="forgot-form"
    [formGroup]="forgotForm"
    (ngSubmit)="onSubmit()"
    class="space-y-6"
  >
    @if (errorMessage()) {
      <div
        class="p-3 bg-red-100/10 text-red-500 border border-red-500/50 rounded-xl text-sm"
        role="alert"
      >
        {{ errorMessage() }}
      </div>
    }

    <div>
      <label for="forgotEmail" class="block text-sm font-medium mb-2"
        >Email address</label
      >
      <input
        id="forgotEmail"
        data-testid="forgot-email-input"
        type="email"
        autocomplete="email"
        formControlName="email"
        class="w-full px-4 py-3 rounded-xl bg-white/50 dark:bg-black/20 border border-slate-200 dark:border-white/10 focus:border-finmate-neon focus:ring-1 focus:ring-finmate-neon outline-none transition-all placeholder-slate-400"
        placeholder="you@example.com"
      />
    </div>

    <app-submit-button
      [label]="'Send reset link'"
      [loadingLabel]="'Sending...'"
      [isLoading]="isLoading()"
      [disabled]="forgotForm.invalid"
      [testId]="'forgot-submit-button'"
      [styleClass]="
        'w-full mt-4 py-3 px-4 bg-gradient-neon text-white rounded-xl font-semibold shadow-lg shadow-finmate-neon/30 hover:shadow-finmate-neon/50 transition-all disabled:opacity-50 disabled:cursor-not-allowed'
      "
    ></app-submit-button>
  </form>

  <div class="mt-6 text-center text-sm">
    <a
      routerLink="/auth/login"
      class="text-finmate-neon2 font-semibold hover:underline"
      >Back to sign in</a
    >
  </div>
}
