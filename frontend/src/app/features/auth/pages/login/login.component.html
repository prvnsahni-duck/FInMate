<div class="text-center mb-8">
  <h2 class="text-2xl font-bold">Welcome back</h2>
  <p class="text-slate-500 dark:text-slate-400 mt-2">
    Enter your details to sign in.
  </p>
</div>

<form
  data-testid="login-form"
  [formGroup]="loginForm"
  (ngSubmit)="onSubmit()"
  class="space-y-6"
>
  @if (resetSuccess) {
    <div
      class="p-3 bg-finmate-neon/10 text-slate-700 dark:text-slate-200 border border-finmate-neon/40 rounded-xl text-sm"
      role="status"
    >
      Your password has been reset. Sign in with your new password.
    </div>
  }

  @if (errorMessage) {
    <div
      class="p-3 bg-red-100/10 text-red-500 border border-red-500/50 rounded-xl text-sm"
      role="alert"
    >
      {{ errorMessage }}
    </div>
  }

  <div>
    <label for="loginEmail" class="block text-sm font-medium mb-2"
      >Email address</label
    >
    <input
      id="loginEmail"
      data-testid="login-email-input"
      type="email"
      autocomplete="email"
      formControlName="email"
      class="w-full px-4 py-3 rounded-xl bg-white/50 dark:bg-black/20 border border-slate-200 dark:border-white/10 focus:border-finmate-neon focus:ring-1 focus:ring-finmate-neon outline-none transition-all placeholder-slate-400"
      placeholder="you@example.com"
    />
  </div>

  <div>
    <label for="loginPassword" class="block text-sm font-medium mb-2"
      >Password</label
    >
    <app-password-input
      inputId="loginPassword"
      testId="login-password-input"
      toggleTestId="login-password-toggle"
      autocomplete="current-password"
      [inputClass]="
        'w-full px-4 py-3 pr-12 rounded-xl bg-white/50 dark:bg-black/20 border border-slate-200 dark:border-white/10 focus:border-finmate-neon focus:ring-1 focus:ring-finmate-neon outline-none transition-all placeholder-slate-400'
      "
      formControlName="password"
    ></app-password-input>
    <div class="mt-2 text-right">
      <a
        routerLink="/auth/forgot-password"
        data-testid="forgot-password-link"
        class="text-sm text-finmate-neon2 font-medium hover:underline"
        >Forgot password?</a
      >
    </div>
  </div>

  <app-submit-button
    [label]="'Sign in'"
    [loadingLabel]="'Signing in...'"
    [isLoading]="isLoading"
    [disabled]="loginForm.invalid"
    [testId]="'login-submit-button'"
    [styleClass]="
      'w-full mt-4 py-3 px-4 bg-gradient-neon text-white rounded-xl font-semibold shadow-lg shadow-finmate-neon/30 hover:shadow-finmate-neon/50 transition-all disabled:opacity-50 disabled:cursor-not-allowed'
    "
  ></app-submit-button>
</form>

<div class="mt-6 text-center text-sm">
  <span class="text-slate-500 dark:text-slate-400"
    >Don't have an account?
  </span>
  <a
    routerLink="/auth/register"
    data-testid="register-link"
    class="text-finmate-neon2 font-semibold hover:underline"
    >Sign up</a
  >
</div>
