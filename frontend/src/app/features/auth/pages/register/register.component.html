<div class="text-center mb-8">
  <h2 class="text-2xl font-bold">Create an account</h2>
  <p class="text-slate-500 dark:text-slate-400 mt-2">
    Join FinMate and manage your finances.
  </p>
</div>

<form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="space-y-4">
  @if (errorMessage) {
    <div
      class="p-3 bg-red-100/10 text-red-500 border border-red-500/50 rounded-xl text-sm"
    >
      {{ errorMessage }}
    </div>
  }

  @if (successMessage) {
    <div
      class="p-3 bg-green-100/10 text-green-500 border border-green-500/50 rounded-xl text-sm"
    >
      {{ successMessage }}
    </div>
  }

  <div>
    <label class="block text-sm font-medium mb-1">Display Name</label>
    <input
      type="text"
      formControlName="displayName"
      class="w-full px-4 py-3 rounded-xl bg-white/50 dark:bg-black/20 border border-slate-200 dark:border-white/10 focus:border-finmate-neon focus:ring-1 focus:ring-finmate-neon outline-none transition-all"
      placeholder="Jane Doe"
    />
  </div>

  <div>
    <label class="block text-sm font-medium mb-1">Email address</label>
    <input
      type="email"
      formControlName="email"
      class="w-full px-4 py-3 rounded-xl bg-white/50 dark:bg-black/20 border border-slate-200 dark:border-white/10 focus:border-finmate-neon focus:ring-1 focus:ring-finmate-neon outline-none transition-all"
      placeholder="you@example.com"
    />
  </div>

  <div>
    <label class="block text-sm font-medium mb-1">Password</label>
    <input
      type="password"
      formControlName="password"
      class="w-full px-4 py-3 rounded-xl bg-white/50 dark:bg-black/20 border border-slate-200 dark:border-white/10 focus:border-finmate-neon focus:ring-1 focus:ring-finmate-neon outline-none transition-all"
      placeholder="••••••••"
    />
    <p class="text-xs text-slate-500 mt-1">
      Must be at least 8 characters, with 1 uppercase, 1 lowercase, 1 number,
      and 1 special character.
    </p>
  </div>

  <app-submit-button
    [label]="'Create account'"
    [loadingLabel]="'Creating account...'"
    [isLoading]="isLoading"
    [disabled]="registerForm.invalid || successMessage !== ''"
    [styleClass]="
      'w-full py-3 px-4 bg-gradient-neon text-white rounded-xl font-semibold shadow-lg shadow-finmate-neon/30 hover:shadow-finmate-neon/50 transition-all disabled:opacity-50 disabled:cursor-not-allowed mt-4'
    "
  ></app-submit-button>
</form>

<div class="mt-6 text-center text-sm">
  <span class="text-slate-500 dark:text-slate-400"
    >Already have an account?
  </span>
  <a
    routerLink="/auth/login"
    class="text-finmate-neon2 font-semibold hover:underline"
    >Sign in</a
  >
</div>
