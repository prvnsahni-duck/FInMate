<div class="recurring-expense-form-container">
  <h2 class="form-title">{{ template ? 'Edit Recurring Expense' : 'Create Recurring Expense' }}</h2>

  @if (errorMessage) {
    <div class="error-banner">{{ errorMessage }}</div>
  }

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="form-layout">
    <!-- Row 1: Title & Description -->
    <div class="form-row">
      <div class="form-field">
        <label for="title">Title *</label>
        <input id="title" type="text" formControlName="title" placeholder="e.g. Netflix Subscription" class="finmate-input" />
      </div>

      <div class="form-field">
        <label for="description">Description</label>
        <input id="description" type="text" formControlName="description" placeholder="Optional notes" class="finmate-input" />
      </div>
    </div>

    <!-- Row 2: Amount, Currency & Category -->
    <div class="form-row flex-3">
      <div class="form-field">
        <label for="amountTotal">Amount Total *</label>
        <div class="amount-input-wrapper">
          <span class="currency-symbol">{{ currencySymbol }}</span>
          <input id="amountTotal" type="number" formControlName="amountTotal" placeholder="0.00" step="0.01" class="finmate-input" />
        </div>
      </div>

      <div class="form-field">
        <label for="currency">Currency *</label>
        <select id="currency" formControlName="currency" class="finmate-input">
          <option value="USD">USD ($)</option>
          <option value="INR">INR (₹)</option>
          <option value="EUR">EUR (€)</option>
        </select>
      </div>

      <div class="form-field">
        <label for="category">Category *</label>
        <select id="category" formControlName="category" class="finmate-input">
          <option value="Food & Drinks">Food & Drinks</option>
          <option value="Housing & Rent">Housing & Rent</option>
          <option value="Utilities & Bills">Utilities & Bills</option>
          <option value="Subscription">Subscription</option>
          <option value="Travel & Commute">Travel & Commute</option>
          <option value="Entertainment">Entertainment</option>
          <option value="Others">Others</option>
        </select>
      </div>
    </div>

    <!-- Row 3: Payer & Frequency -->
    <div class="form-row">
      <div class="form-field">
        <label for="paidByUserId">Paid By *</label>
        <select id="paidByUserId" formControlName="paidByUserId" class="finmate-input">
          @for (payer of availablePayers; track payer.id) {
            <option [value]="payer.id">{{ payer.name }}</option>
          }
        </select>
      </div>

      <div class="form-field">
        <label for="frequency">Frequency *</label>
        <select id="frequency" formControlName="frequency" class="finmate-input">
          <option value="daily">Daily</option>
          <option value="weekly">Weekly</option>
          <option value="monthly">Monthly</option>
          <option value="yearly">Yearly</option>
        </select>
      </div>
    </div>

    <!-- Row 4: Start & End Date -->
    <div class="form-row">
      <div class="form-field">
        <label for="startDate">Start Date *</label>
        <input id="startDate" type="date" formControlName="startDate" class="finmate-input" />
      </div>

      <div class="form-field">
        <label for="endDate">End Date (Optional)</label>
        <input id="endDate" type="date" formControlName="endDate" class="finmate-input" />
      </div>
    </div>

    <!-- Splits Participant Checklist -->
    <div class="form-field participants-checklist">
      <label>Split Beneficiaries *</label>
      <div class="checklist-grid">
        @for (member of availableParticipants; track member.id) {
          <div class="checklist-item" (click)="toggleParticipant(member.id)">
            <input type="checkbox" [checked]="selectedUserIds.has(member.id)" readonly />
            <span>{{ member.name }}</span>
          </div>
        }
      </div>
    </div>

    <!-- Actions -->
    <div class="form-actions">
      <button type="button" (click)="cancel.emit()" class="btn-secondary" [disabled]="isSubmitting">Cancel</button>
      <app-submit-button [isLoading]="isSubmitting" [disabled]="!form.valid || selectedUserIds.size === 0">
        {{ template ? 'Save Changes' : 'Create Template' }}
      </app-submit-button>
    </div>
  </form>
</div>
