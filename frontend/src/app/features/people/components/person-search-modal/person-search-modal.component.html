<div
  class="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-black/50 backdrop-blur-sm p-0 sm:p-4"
>
  <div
    class="w-full sm:max-w-md bg-white dark:bg-finmate-card rounded-t-3xl sm:rounded-3xl p-6 shadow-2xl max-h-[90vh] overflow-y-auto"
    role="dialog"
    aria-modal="true"
    aria-labelledby="search-title"
  >
    <div class="flex items-center justify-between mb-4">
      <h2 id="search-title" class="text-xl font-bold">New transaction</h2>
      <button
        type="button"
        (click)="closed.emit()"
        class="w-8 h-8 rounded-full flex items-center justify-center bg-slate-100 dark:bg-white/10"
        aria-label="Close"
      >
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <label for="person-search" class="block text-sm font-medium mb-1">Find a person</label>
    <input
      id="person-search"
      type="search"
      [formControl]="query"
      class="input-base"
      placeholder="Search by name, email, or phone"
      autocomplete="off"
      data-testid="person-search-input"
    />

    <div class="mt-4 min-h-[3rem]">
      @if (isSearching()) {
        <p class="text-sm text-slate-500 dark:text-slate-400">Searching…</p>
      } @else if (results().length > 0) {
        <ul class="space-y-1" data-testid="search-results">
          @for (user of results(); track user.id) {
            <li>
              <button
                type="button"
                (click)="pick(user)"
                class="w-full flex items-center gap-3 p-3 rounded-2xl hover:bg-slate-50 dark:hover:bg-white/5 text-left"
                data-testid="search-result"
              >
                <div class="w-9 h-9 shrink-0 rounded-full bg-slate-200 dark:bg-white/10 flex items-center justify-center font-bold text-slate-600 dark:text-slate-300">
                  {{ (user.displayName || user.email).substring(0, 2).toUpperCase() }}
                </div>
                <div class="min-w-0">
                  <p class="font-semibold truncate">{{ user.displayName || user.email }}</p>
                  <p class="text-xs text-slate-500 dark:text-slate-400 truncate">{{ user.email }}</p>
                </div>
              </button>
            </li>
          }
        </ul>
      } @else if (searched()) {
        <p class="text-sm text-slate-500 dark:text-slate-400" data-testid="search-empty">
          No people found. Try a different name, email, or phone.
        </p>
      } @else {
        <p class="text-xs text-slate-400">Type at least 2 characters to search.</p>
      }
    </div>
  </div>
</div>
