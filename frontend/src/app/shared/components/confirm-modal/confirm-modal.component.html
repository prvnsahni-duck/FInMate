<div
  class="fixed inset-0 z-[100] flex items-end justify-center md:items-end lg:items-center md:p-4 lg:p-4"
>
  <!-- Backdrop with blur -->
  <div
    class="fixed inset-0 bg-slate-900/40 dark:bg-black/60 backdrop-blur-sm transition-opacity duration-300"
    (click)="onCancel()"
  ></div>

  <!-- Modal Card -->
  <div
    class="relative bg-white dark:bg-finmate-card border border-slate-200 dark:border-white/5 rounded-t-3xl md:rounded-t-3xl md:rounded-b-none lg:rounded-3xl p-6 pb-safe lg:p-8 shadow-2xl w-full max-w-md z-10 transform scale-100 transition-all duration-300 animate-slide-up"
  >
    <!-- Drag/Pull handle indicator for tablet bottom sheet -->
    <div
      class="hidden md:block lg:hidden w-12 h-1.5 bg-slate-200 dark:bg-white/10 rounded-full mx-auto mb-4"
    ></div>

    <!-- Icon section based on type -->
    <div class="flex items-center justify-center mb-5">
      <div
        [ngClass]="{
          'bg-red-500/10 text-red-500': type === 'danger',
          'bg-amber-500/10 text-amber-500': type === 'warning',
          'bg-blue-500/10 text-blue-500': type === 'info',
        }"
        class="w-14 h-14 rounded-full flex items-center justify-center"
      >
        <!-- Danger SVG -->
        @if (type === 'danger') {
          <svg
            class="w-7 h-7"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"
            ></path>
          </svg>
        }
        <!-- Warning SVG -->
        @if (type === 'warning') {
          <svg
            class="w-7 h-7"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"
            ></path>
          </svg>
        }
        <!-- Info SVG -->
        @if (type === 'info') {
          <svg
            class="w-7 h-7"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
            ></path>
          </svg>
        }
      </div>
    </div>

    <!-- Title & Message -->
    <h3
      class="text-xl font-bold text-center text-slate-800 dark:text-white mb-2"
    >
      {{ title }}
    </h3>
    <p class="text-sm text-center text-slate-500 dark:text-slate-400 mb-6">
      {{ message }}
    </p>

    <!-- Actions -->
    <div class="grid grid-cols-2 gap-3">
      <button
        (click)="onCancel()"
        class="py-3 px-4 bg-slate-100 dark:bg-white/5 hover:bg-slate-200 dark:hover:bg-white/10 text-slate-700 dark:text-slate-300 rounded-2xl font-bold text-sm transition-all focus:outline-none"
      >
        {{ cancelText }}
      </button>

      <button
        (click)="onConfirm()"
        [ngClass]="{
          'bg-gradient-to-r from-red-500 to-rose-600 shadow-red-500/20 hover:shadow-red-500/35':
            type === 'danger',
          'bg-gradient-to-r from-amber-500 to-orange-600 shadow-amber-500/20 hover:shadow-amber-500/35':
            type === 'warning',
          'bg-gradient-neon shadow-finmate-neon/20 hover:shadow-finmate-neon/35':
            type === 'info',
        }"
        class="py-3 px-4 text-white rounded-2xl font-bold text-sm transition-all shadow-md focus:outline-none"
      >
        {{ confirmText }}
      </button>
    </div>
  </div>
</div>
