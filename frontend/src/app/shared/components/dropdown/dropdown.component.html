<div class="relative w-full" [class]="styleClass" [attr.id]="id">
  @if (label) {
    <div class="block text-sm font-semibold mb-2 text-slate-700 dark:text-slate-300">
      {{ label }}
    </div>
  }

  <!-- Trigger Button -->
  <button
    type="button"
    (click)="toggle()"
    [disabled]="disabled"
    class="w-full flex items-center justify-between bg-surface border border-border/10 text-secondary outline-none transition-all duration-200 cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed hover:bg-surface-alt"
    [class.px-4]="size === 'md'"
    [class.py-3]="size === 'md'"
    [class.rounded-2xl]="size === 'md'"
    [class.text-sm]="size === 'md'"
    [class.px-3]="size === 'sm'"
    [class.py-2]="size === 'sm'"
    [class.rounded-xl]="size === 'sm'"
    [class.text-xs]="size === 'sm'"
    [class.border-primary]="isOpen"
    [class.ring-1]="isOpen"
    [class.ring-primary]="isOpen"
    [attr.aria-haspopup]="true"
    [attr.aria-expanded]="isOpen"
  >
    <span class="truncate flex items-center gap-2">
      @if (selectedOption()?.icon) {
        <span class="flex-shrink-0" [innerHTML]="selectedOption()?.icon"></span>
      }
      <span class="font-medium text-secondary">
        {{ selectedOption() ? selectedOption()!.label : placeholder }}
      </span>
    </span>
    <svg
      class="text-muted transition-transform duration-200 flex-shrink-0"
      [class.w-4]="size === 'md'"
      [class.h-4]="size === 'md'"
      [class.w-3.5]="size === 'sm'"
      [class.h-3.5]="size === 'sm'"
      [class.rotate-180]="isOpen"
      fill="none"
      stroke="currentColor"
      viewBox="0 0 24 24"
    >
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
    </svg>
  </button>

  <!-- Dropdown Menu -->
  @if (isOpen) {
    <div
      class="absolute z-50 mt-2 w-full bg-finmate-card border border-border/10 rounded-2xl shadow-xl max-h-60 overflow-y-auto transform origin-top transition-all duration-200 py-1"
    >
      @for (option of options; track option.value; let idx = $index) {
        <button
          type="button"
          (click)="selectOption(option)"
          class="w-full text-left hover:bg-surface flex flex-col transition-colors relative border-b last:border-0 border-border/5"
          [class.px-4]="size === 'md'"
          [class.py-3]="size === 'md'"
          [class.px-3]="size === 'sm'"
          [class.py-2]="size === 'sm'"
          [class.bg-surface]="idx === focusedIndex"
        >
          <div class="flex items-center justify-between w-full">
            <span class="truncate flex items-center gap-2 text-secondary" [class.text-sm]="size === 'md'" [class.text-xs]="size === 'sm'" [class.font-bold]="option.value === value()">
              @if (option.icon) {
                <span class="flex-shrink-0" [innerHTML]="option.icon"></span>
              }
              <span>{{ option.label }}</span>
            </span>
            @if (option.value === value()) {
              <svg class="text-primary flex-shrink-0" [class.w-4]="size === 'md'" [class.h-4]="size === 'md'" [class.w-3.5]="size === 'sm'" [class.h-3.5]="size === 'sm'" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7" />
              </svg>
            }
          </div>
          @if (option.description) {
            <span class="text-[11px] text-muted mt-0.5 truncate">{{ option.description }}</span>
          }
        </button>
      } @empty {
        <div class="px-4 py-3 text-sm text-muted text-center">
          No options available
        </div>
      }
    </div>
  }
</div>
