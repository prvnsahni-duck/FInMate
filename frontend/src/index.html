<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>FinMate</title>
    <base href="/" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta
      name="theme-color"
      content="#121212"
      media="(prefers-color-scheme: dark)"
    />
    <meta
      name="theme-color"
      content="#f8fafc"
      media="(prefers-color-scheme: light)"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta
      name="description"
      content="FinMate — Smart expense tracking and group finance management"
    />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <!-- Inline theme init: prevents flash of wrong theme before Angular boots -->
    <script>
      (function() {
        var t = localStorage.getItem('finmate_theme') || 'light';
        if (t === 'dark') document.documentElement.classList.add('dark');
      })();
    </script>
  </head>
  <body class="bg-finmate-bg text-secondary antialiased">
    <app-root></app-root>
  </body>
</html>
