        - userId
        - role
        - joinStatus
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        groupId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        role:
          type: string
          enum: [owner, admin, member, viewer]
        joinStatus:
          type: string
          enum: [invited, active, left, removed]
        joinedAt:
          type: string
          format: date-time
          nullable: true
        leftAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ExpenseResponse:
      type: object
      required:
        - id
        - title
        - description
        - amountTotal
        - currency
        - category
        - paidByUserId
        - ownerUserId
        - groupId
        - expenseDate
