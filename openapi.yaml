openapi: 3.0.3
info:
  title: FinMate API
  description: |
    API Contract for FinMate, a Personal Finance & Lifestyle Companion.
    Provides endpoints for Auth, Users, Groups, Expenses, Settlements, Notes, Goals, and Import/Export.
    
    ### Versioning Strategy
    URL-based versioning is used. All paths start with `/api/v1`.
    
    ### Pagination & Filtering
    Paginated GET endpoints support standard query parameters:
    * `page`: 1-based page index (default: `1`)
    * `limit`: Page size (default: `20`, max: `100`)
    * `cursor`: Cursor string (for cursor-based pagination on rapidly updated lists like Expenses and Audit Logs)
  version: 1.0.0
servers:
  - url: /api/v1
    description: Local Dev Server

paths:
  /auth/register:
    post:
      summary: Register a new user
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
                password:
                  type: string
                  format: password
                  minLength: 8
                  example: securePassword123!
                displayName:
                  type: string
                  maxLength: 120
                  example: John Doe
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/ConflictError'

  /auth/login:
    post:
      summary: Login user and retrieve JWT tokens
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
                password:
                  type: string
                  format: password
                  example: securePassword123!
                deviceId:
                  type: string
                  example: "web-client-chrome-1234"
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                required:
                  - accessToken
                  - refreshToken
                  - user
                properties:
                  accessToken:
                    type: string
                    example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                  refreshToken:
                    type: string
                    example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                  user:
                    $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /auth/refresh:
    post:
      summary: Refresh access token using a valid refresh token
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string
                  example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
      responses:
        '200':
          description: Tokens refreshed successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - accessToken
                  - refreshToken
                properties:
                  accessToken:
                    type: string
                  refreshToken:
                    type: string
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /auth/logout:
    post:
      summary: Invalidate user session
      tags:
        - Auth
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Logout successful
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /auth/2fa/enable:
    post:
      summary: Initiate 2FA TOTP setup
      tags:
        - Auth
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 2FA initialization details returned
          content:
            application/json:
              schema:
                type: object
                required:
                  - secret
                  - qrCodeUrl
                properties:
                  secret:
                    type: string
                    example: "KVKFKRCSN5RHK33O"
                  qrCodeUrl:
                    type: string
                    example: "otpauth://totp/FinMate:user@example.com?secret=KVKFKRCSN5RHK33O&issuer=FinMate"
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /auth/2fa/verify:
    post:
      summary: Verify and complete 2FA setup
      tags:
        - Auth
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
              properties:
                code:
                  type: string
                  pattern: "^[0-9]{6}$"
                  example: "123456"
      responses:
        '200':
          description: 2FA enabled successfully
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /auth/2fa/disable:
    post:
      summary: Disable 2FA for the account
      tags:
        - Auth
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
              properties:
                code:
                  type: string
                  pattern: "^[0-9]{6}$"
                  example: "123456"
      responses:
        '204':
          description: 2FA disabled successfully
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /users/me:
    get:
      summary: Get current user profile
      tags:
        - Users
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile details
          content:
            application/json:
              schema:
                type: object
                required:
                  - user
                  - profile
                properties:
                  user:
                    $ref: '#/components/schemas/UserResponse'
                  profile:
                    $ref: '#/components/schemas/Profile'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    patch:
      summary: Update user profile
      tags:
        - Users
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName:
                  type: string
                  maxLength: 120
                avatarUrl:
                  type: string
                  format: uri
                locale:
                  type: string
                  example: "en-IN"
                timezone:
                  type: string
                  example: "Asia/Kolkata"
                defaultCurrency:
                  type: string
                  maxLength: 3
                  example: "INR"
                monthlyBudget:
                  type: number
                  minimum: 0
                  example: 50000.00
      responses:
        '200':
          description: Profile updated successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - user
                  - profile
                properties:
                  user:
                    $ref: '#/components/schemas/UserResponse'
                  profile:
                    $ref: '#/components/schemas/Profile'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    delete:
      summary: Deactivate user account
      tags:
        - Users
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Account deactivated successfully
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /groups:
    post:
      summary: Create an expense group
      tags:
        - Groups
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  maxLength: 120
                  example: "Flatmates Goa Trip"
                description:
                  type: string
                  example: "Sharing expenses for our trip to Goa"
                visibility:
                  type: string
                  enum: [private, invite_only, public_readonly]
                  default: private
      responses:
        '201':
          description: Group created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    get:
      summary: List groups current user is a member of
      tags:
        - Groups
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: isArchived
          in: query
          schema:
            type: boolean
          required: false
      responses:
        '200':
          description: List of groups
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Group'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /groups/{id}:
    get:
      summary: Get details of a group
      tags:
        - Groups
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Group details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    patch:
      summary: Update group metadata or archive group
      tags:
        - Groups
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 120
                description:
                  type: string
                visibility:
                  type: string
                  enum: [private, invite_only, public_readonly]
                isArchived:
                  type: boolean
      responses:
        '200':
          description: Group updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /groups/{id}/members:
    post:
      summary: Invite or add a member to the group
      tags:
        - Groups
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - role
              properties:
                email:
                  type: string
                  format: email
                  example: friend@example.com
                role:
                  type: string
                  enum: [admin, member, viewer]
                  default: member
      responses:
        '201':
          description: Member added/invited successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupMember'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
    get:
      summary: List all members of the group
      tags:
        - Groups
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of group members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GroupMember'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /groups/{id}/members/{memberId}:
    patch:
      summary: Update a group member role or join status
      description: |
        Used by admins to modify member roles, or by the member themselves to accept/decline/leave group.
      tags:
        - Groups
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: memberId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role:
                  type: string
                  enum: [owner, admin, member, viewer]
                joinStatus:
                  type: string
                  enum: [invited, active, left, removed]
      responses:
        '200':
          description: Member updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupMember'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    delete:
      summary: Remove a member from the group or leave the group
      tags:
        - Groups
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: memberId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Member removed successfully
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /expenses:
    post:
      summary: Create a personal or group expense
      tags:
        - Expenses
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
                - amountTotal
                - currency
                - category
                - paidByUserId
                - expenseDate
                - splits
              properties:
                title:
                  type: string
                  maxLength: 160
                  example: "Dinner at Taj"
                description:
                  type: string
                  example: "Celebration dinner"
                amountTotal:
                  type: number
                  format: float
                  example: 4500.00
                currency:
                  type: string
                  maxLength: 3
                  example: "INR"
                category:
                  type: string
                  example: "Food"
                paidByUserId:
                  type: string
                  format: uuid
                groupId:
                  type: string
                  format: uuid
                  nullable: true
                expenseDate:
                  type: string
                  format: date
                  example: "2026-06-09"
                status:
                  type: string
                  enum: [draft, posted, void]
                  default: posted
                splits:
                  type: array
                  items:
                    $ref: '#/components/schemas/ExpenseSplitInput'
                attachmentKeys:
                  type: array
                  items:
                    type: string
                  example: ["receipts/20260609_taj.jpg"]
      responses:
        '201':
          description: Expense created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    get:
      summary: List expenses with pagination and filtering
      tags:
        - Expenses
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: cursor
          in: query
          schema:
            type: string
          required: false
        - name: groupId
          in: query
          schema:
            type: string
            format: uuid
          required: false
        - name: category
          in: query
          schema:
            type: string
          required: false
        - name: startDate
          in: query
          schema:
            type: string
            format: date
          required: false
        - name: endDate
          in: query
          schema:
            type: string
            format: date
          required: false
      responses:
        '200':
          description: List of expenses
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ExpenseResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /expenses/{id}:
    get:
      summary: Retrieve specific expense details
      tags:
        - Expenses
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Expense details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    patch:
      summary: Update expense details and splits
      tags:
        - Expenses
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  maxLength: 160
                description:
                  type: string
                amountTotal:
                  type: number
                currency:
                  type: string
                  maxLength: 3
                category:
                  type: string
                paidByUserId:
                  type: string
                  format: uuid
                expenseDate:
                  type: string
                  format: date
                status:
                  type: string
                  enum: [draft, posted, void]
                splits:
                  type: array
                  items:
                    $ref: '#/components/schemas/ExpenseSplitInput'
                attachmentKeys:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Expense updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '412':
          $ref: '#/components/responses/PreconditionFailedError'
    delete:
      summary: Void or remove an expense
      tags:
        - Expenses
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Expense voided or deleted successfully
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /groups/{groupId}/settlements:
    post:
      summary: Propose a new settlement balance payment
      tags:
        - Settlements
      security:
        - bearerAuth: []
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - toUserId
                - amount
                - currency
              properties:
                toUserId:
                  type: string
                  format: uuid
                  example: "f81d4fae-7dec-11d0-a765-00a0c91e6bf6"
                amount:
                  type: number
                  example: 1250.00
                currency:
                  type: string
                  maxLength: 3
                  example: "INR"
                note:
                  type: string
                  example: "Settling taj dinner"
      responses:
        '201':
          description: Settlement proposed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settlement'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
    get:
      summary: List settlements in a group
      tags:
        - Settlements
      security:
        - bearerAuth: []
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: List of settlements
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Settlement'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /groups/{groupId}/settlements/balances:
    get:
      summary: Retrieve the simplified net balances for all members in the group
      description: |
        Calculates group ledger totals. Negative balance means you owe money; positive means you are owed money.
      tags:
        - Settlements
      security:
        - bearerAuth: []
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Calculated net balances and suggested direct settlements to resolve debts
          content:
            application/json:
              schema:
                type: object
                required:
                  - balances
                  - suggestedSettlements
                properties:
                  balances:
                    type: array
                    items:
                      type: object
                      required:
                        - userId
                        - displayName
                        - netBalance
                        - currency
                      properties:
                        userId:
                          type: string
                          format: uuid
                        displayName:
                          type: string
                        netBalance:
                          type: number
                          description: Positive indicates creditor, negative indicates debtor.
                        currency:
                          type: string
                  suggestedSettlements:
                    type: array
                    items:
                      type: object
                      required:
                        - fromUserId
                        - toUserId
                        - amount
                        - currency
                      properties:
                        fromUserId:
                          type: string
                          format: uuid
                        toUserId:
                          type: string
                          format: uuid
                        amount:
                          type: number
                        currency:
                          type: string
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /groups/{groupId}/settlements/{id}:
    patch:
      summary: Update settlement status (Confirm or Cancel)
      description: |
        Confirming a settlement closes the debt transaction. Declining/cancelling voids it.
      tags:
        - Settlements
      security:
        - bearerAuth: []
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [confirmed, cancelled]
                settledOn:
                  type: string
                  format: date
                  example: "2026-06-09"
      responses:
        '200':
          description: Settlement status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settlement'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /notes:
    post:
      summary: Create a personal or group note
      tags:
        - Notes
      security:
        - bearerAuth: []
