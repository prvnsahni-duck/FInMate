  /import/expenses:
    post:
      summary: Upload CSV/XLSX to import expenses
      description: |
        Imports raw transactions into drafts or posted expenses.
      tags:
        - Import/Export
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: The CSV or XLSX file containing expense transactions.
                groupId:
                  type: string
                  format: uuid
                  description: Optional group to associate imported expenses with.
      responses:
        '200':
          description: Import processed successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - successCount
                  - errorCount
                  - errors
                properties:
                  successCount:
                    type: integer
                    example: 12
                  errorCount:
                    type: integer
                    example: 1
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        row:
                          type: integer
                          example: 5
                        message:
                          type: string
                          example: "Missing required field: amount"
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /export/expenses:
    get:
      summary: Export expenses as CSV or XLSX
      tags:
        - Import/Export
      security:
        - bearerAuth: []
      parameters:
        - name: format
          in: query
          required: true
          schema:
            type: string
            enum: [csv, xlsx]
            default: csv
        - name: groupId
          in: query
          schema:
            type: string
            format: uuid
          required: false
        - name: startDate
          in: query
          schema:
            type: string
            format: date
          required: false
        - name: endDate
          in: query
          schema:
            type: string
            format: date
          required: false
      responses:
        '200':
          description: File download containing exported expenses
          headers:
            Content-Disposition:
              schema:
                type: string
                example: "attachment; filename=\"expenses_export_20260609.csv\""
          content:
            text/csv:
              schema:
                type: string
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    PageParam:
      name: page
      in: query
      description: Page number (1-indexed)
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    LimitParam:
      name: limit
      in: query
      description: Number of elements per page
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  responses:
    ValidationError:
      description: Input validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            statusCode: 400
            timestamp: "2026-06-09T17:15:00.000Z"
            path: "/api/v1/auth/register"
            errorCode: "VAL_INVALID_INPUT"
            message: "Input validation failed"
            details:
              - field: "email"
                issue: "must be a valid email address"
            retryable: false

    UnauthorizedError:
      description: Authentication failed or token missing/expired
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            statusCode: 401
            timestamp: "2026-06-09T17:15:00.000Z"
            path: "/api/v1/users/me"
            errorCode: "AUTH_TOKEN_EXPIRED"
            message: "JWT access token has expired"
            retryable: false

    ForbiddenError:
      description: Permissions not met for resource action
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            statusCode: 403
            timestamp: "2026-06-09T17:15:00.000Z"
            path: "/api/v1/groups/d3b07384-d113-49c3-a558-f54248880bf6"
            errorCode: "RES_FORBIDDEN"
            message: "You do not have access to view this group."
            retryable: false

    NotFoundError:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            statusCode: 404
            timestamp: "2026-06-09T17:15:00.000Z"
            path: "/api/v1/expenses/f81d4fae-7dec-11d0-a765-00a0c91e6bf6"
            errorCode: "RES_NOT_FOUND"
            message: "Expense with ID f81d4fae-7dec-11d0-a765-00a0c91e6bf6 does not exist."
            retryable: false

    ConflictError:
      description: Resource constraint or duplication conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            statusCode: 409
            timestamp: "2026-06-09T17:15:00.000Z"
            path: "/api/v1/auth/register"
            errorCode: "RES_ALREADY_EXISTS"
            message: "A user with email user@example.com already exists."
            retryable: false

    PreconditionFailedError:
      description: State conflict or optimistic lock version mismatch
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            statusCode: 412
            timestamp: "2026-06-09T17:15:00.000Z"
            path: "/api/v1/expenses/f81d4fae-7dec-11d0-a765-00a0c91e6bf6"
            errorCode: "CON_VERSION_CONFLICT"
            message: "The resource version has changed. Please fetch the latest state and retry."
            retryable: true

  schemas:
    ErrorResponse:
      type: object
      required:
        - statusCode
        - timestamp
        - path
        - errorCode
        - message
        - retryable
      properties:
        statusCode:
          type: integer
        timestamp:
          type: string
          format: date-time
        path:
          type: string
        errorCode:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            type: object
            required:
              - field
              - issue
            properties:
              field:
                type: string
              issue:
                type: string
        retryable:
          type: boolean

    PaginatedResponse:
      type: object
      required:
        - data
        - meta
        - links
      properties:
        meta:
          type: object
          required:
            - totalItems
            - itemCount
            - itemsPerPage
            - totalPages
            - currentPage
          properties:
            totalItems:
              type: integer
            itemCount:
              type: integer
            itemsPerPage:
              type: integer
            totalPages:
              type: integer
            currentPage:
              type: integer
        links:
          type: object
          required:
            - first
            - last
          properties:
            first:
              type: string
            previous:
              type: string
              nullable: true
            next:
              type: string
              nullable: true
            last:
              type: string

    UserResponse:
      type: object
      required:
        - id
        - email
        - displayName
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
          nullable: true
        status:
          type: string
          enum: [active, disabled, invited]
        lastLoginAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Profile:
      type: object
      required:
        - id
        - userId
        - avatarUrl
        - locale
        - timezone
        - defaultCurrency
        - monthlyBudget
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        avatarUrl:
          type: string
          format: uri
          nullable: true
        locale:
          type: string
        timezone:
          type: string
        defaultCurrency:
          type: string
        monthlyBudget:
          type: number
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Group:
      type: object
      required:
        - id
        - name
        - description
        - visibility
        - ownerUserId
        - isArchived
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        visibility:
          type: string
          enum: [private, invite_only, public_readonly]
        ownerUserId:
          type: string
          format: uuid
        isArchived:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    GroupMember:
      type: object
      required:
        - id
